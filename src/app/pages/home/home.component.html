<div class="home-container">

  <!-- =========================================
       SIDEBAR
  ========================================== -->

  <app-sidebar></app-sidebar>


  <!-- =========================================
       MAIN CONTENT
  ========================================== -->

  <main class="content">

    <!-- =========================================
         EMPTY / LANDING STATE
    ========================================== -->

    <section class="welcome" *ngIf="messages.length === 0" aria-label="Welcome">

      <div class="welcome-glow"></div>

      <div class="welcome-content">

        <!-- Brand -->

        <div class="logo-wrap">
          <div class="logo">
            wX1<span>.ai</span>
          </div>
        </div>


        <!-- Hero copy -->

        <h1 class="welcome-title">
          Create something remarkable.
        </h1>

        <p class="tagline">
          Create. Discover. Imagine.
        </p>


        <!-- =====================================
             QUICK ACTIONS
        ====================================== -->

        <div class="suggestions">

          <button type="button" class="suggestion">

            <span class="suggestion-icon" aria-hidden="true">
              ✦
            </span>

            <span class="suggestion-content">
              <strong>Create something</strong>
              <small>Bring your ideas to life</small>
            </span>

            <span class="suggestion-arrow" aria-hidden="true">
              ↗
            </span>

          </button>


          <button type="button" class="suggestion">

            <span class="suggestion-icon" aria-hidden="true">
              ⌁
            </span>

            <span class="suggestion-content">
              <strong>Explore ideas</strong>
              <small>Discover something new</small>
            </span>

            <span class="suggestion-arrow" aria-hidden="true">
              ↗
            </span>

          </button>


          <button type="button" class="suggestion">

            <span class="suggestion-icon" aria-hidden="true">
              ◌
            </span>

            <span class="suggestion-content">
              <strong>Ask anything</strong>
              <small>Start a conversation</small>
            </span>

            <span class="suggestion-arrow" aria-hidden="true">
              ↗
            </span>

          </button>

        </div>

      </div>

    </section>



    <!-- =========================================
         CHAT AREA
    ========================================== -->

    <section #chatContainer class="chat-area" *ngIf="messages.length > 0" aria-label="Conversation">

      <div *ngFor="let msg of messages" class="message-row" [ngClass]="msg.role">

        <!-- =====================================
             ASSISTANT AVATAR
        ====================================== -->

        <div class="message-avatar" *ngIf="msg.role === 'assistant'" aria-hidden="true">
          W
        </div>


        <!-- =====================================
             MESSAGE
        ====================================== -->

        <article class="message" [class.image-message]="msg.type === 'image'">

          <!-- ===================================
               TEXT RESPONSE
          ==================================== -->

          <ng-container *ngIf="msg.type !== 'image'">

            <div class="text-content">
              {{ msg.content }}
            </div>


            <!-- Text actions -->

            <div class="message-actions">

              <!-- COPY -->

              <button type="button" class="message-action" [class.is-success]="copiedMessage === msg.content"
                (click)="copyText(msg.content)" [attr.aria-label]="
                  copiedMessage === msg.content
                    ? 'Copied'
                    : 'Copy message'
                ">

                <svg *ngIf="copiedMessage !== msg.content" class="action-icon" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                  aria-hidden="true">
                  <rect x="9" y="9" width="10" height="10" rx="2"></rect>

                  <path d="M15 9V7a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"></path>
                </svg>


                <svg *ngIf="copiedMessage === msg.content" class="action-icon" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  aria-hidden="true">
                  <path d="m5 12 4 4L19 6"></path>
                </svg>


                <span class="action-tooltip">
                  {{
                  copiedMessage === msg.content
                  ? 'Copied'
                  : 'Copy'
                  }}
                </span>

              </button>


              <!-- DOWNLOAD -->

              <button type="button" class="message-action" [class.is-success]="downloadedMessage === msg.content"
                (click)="downloadText(msg.content)" [attr.aria-label]="
                  downloadedMessage === msg.content
                    ? 'Downloaded'
                    : 'Download message'
                ">

                <svg *ngIf="downloadedMessage !== msg.content" class="action-icon" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                  aria-hidden="true">
                  <path d="M12 3v12"></path>
                  <path d="m7 10 5 5 5-5"></path>
                  <path d="M5 21h14"></path>
                </svg>


                <svg *ngIf="downloadedMessage === msg.content" class="action-icon" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  aria-hidden="true">
                  <path d="m5 12 4 4L19 6"></path>
                </svg>


                <span class="action-tooltip">
                  {{
                  downloadedMessage === msg.content
                  ? 'Downloaded'
                  : 'Download'
                  }}
                </span>

              </button>

            </div>

          </ng-container>



          <!-- ===================================
               GENERATED IMAGE
          ==================================== -->

          <ng-container *ngIf="msg.type === 'image'">

            <div class="image-wrapper">

              <img [src]="'data:image/png;base64,' + msg.content" alt="Generated image" class="generated-image" />

            </div>


            <!-- Image actions -->

            <div class="message-actions image-actions">

              <!-- COPY IMAGE -->

              <button type="button" class="message-action" [class.is-success]="copiedMessage === msg.content"
                (click)="copyImage(msg.content)" [attr.aria-label]="
                  copiedMessage === msg.content
                    ? 'Copied'
                    : 'Copy image'
                ">

                <svg *ngIf="copiedMessage !== msg.content" class="action-icon" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                  aria-hidden="true">
                  <rect x="9" y="9" width="10" height="10" rx="2"></rect>

                  <path d="M15 9V7a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"></path>
                </svg>


                <svg *ngIf="copiedMessage === msg.content" class="action-icon" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  aria-hidden="true">
                  <path d="m5 12 4 4L19 6"></path>
                </svg>


                <span class="action-tooltip">
                  {{
                  copiedMessage === msg.content
                  ? 'Copied'
                  : 'Copy'
                  }}
                </span>

              </button>


              <!-- DOWNLOAD IMAGE -->

              <button type="button" class="message-action" [class.is-success]="downloadedMessage === msg.content"
                (click)="downloadImage(msg.content)" [attr.aria-label]="
                  downloadedMessage === msg.content
                    ? 'Downloaded'
                    : 'Download image'
                ">

                <svg *ngIf="downloadedMessage !== msg.content" class="action-icon" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                  aria-hidden="true">
                  <path d="M12 3v12"></path>
                  <path d="m7 10 5 5 5-5"></path>
                  <path d="M5 21h14"></path>
                </svg>


                <svg *ngIf="downloadedMessage === msg.content" class="action-icon" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  aria-hidden="true">
                  <path d="m5 12 4 4L19 6"></path>
                </svg>


                <span class="action-tooltip">
                  {{
                  downloadedMessage === msg.content
                  ? 'Downloaded'
                  : 'Download'
                  }}
                </span>

              </button>

            </div>

          </ng-container>

        </article>

      </div>

    </section>



    <!-- =========================================
         PROMPT
    ========================================== -->

    <div class="prompt-container">

      <app-search-bar (messageEvent)="addMessage($event)"></app-search-bar>

    </div>

  </main>

</div>
