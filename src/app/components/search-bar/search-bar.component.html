<div class="search-box">

  <!-- Add / Plus button -->
  <button class="action-btn plus" type="button" title="Add" aria-label="Add">

    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

      <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round" />

    </svg>

  </button>


  <!-- Message input -->
  <textarea #messageInput [(ngModel)]="prompt" (input)="autoResize(messageInput)"
    (keydown.enter)="handleEnter($event, messageInput)" placeholder="Ask anything..." rows="1" aria-label="Message">
</textarea>



  <!-- Image generation button -->
  <button class="action-btn image-btn" type="button" [class.selected]="imageMode" (click)="toggleImageMode()"
    [title]="imageMode ? 'Image generation enabled' : 'Generate image'" aria-label="Generate image">

    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

      <rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.8" />

      <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor" />

      <path d="M21 15L16.5 10.5L7 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
        stroke-linejoin="round" />

    </svg>

  </button>


  <!-- Send button -->
  <button class="send-btn" type="button" (click)="askClaude()" [disabled]="!prompt.trim()" title="Send message"
    aria-label="Send message">

    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

      <path d="M21 3L10.5 13.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

      <path d="M21 3L14.3 21L10.5 13.5L3 9.7L21 3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" />

    </svg>

  </button>

</div>
