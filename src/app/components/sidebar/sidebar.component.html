<aside class="sidebar" [class.mobile-open]="isOpen">

  <!-- Mobile Close Button (shown only when open on mobile) -->
  <button type="button" class="mobile-close-btn" (click)="onClose()" aria-label="Close sidebar">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </button>

  <div class="brand">wX1</div>

  <div class="menu">

    <!-- Creations -->
    <div class="item">
      <a href="/creations" (click)="onItemClick()">
        <div class="icon creation-icon">

            <path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2z"/>
            <circle cx="19" cy="4" r="1.5"/>
          </svg>
        </div>

    </div>

    <!-- Discover -->
    <div class="item">
      <a href="https://api.whatsapp.com/send/?phone=919035615972&text&type=phone_number&app_absent=0"
         target="_blank"
         rel="noopener noreferrer"
         (click)="onItemClick()">

          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"/>

         (click)="onItemClick()">
        <div class="icon instagram-icon">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="5"/>
            <circle cx="12" cy="12" r="4.2"/>
            <circle cx="17.5" cy="6.5" r="1.2" class="dot"/>

    <!-- X -->

            <path d="M13.5 21v-8h2.7l.4-3h-3.1V8.1c0-.9.3-1.5 1.6-1.5h1.7V4c-.3 0-1.3-.1-2.4-.1-2.4 0-4 1.5-4 4.1V10H8v3h2.4v8h3.1z"/>

    <!-- LinkedIn -->

            <circle cx="5.5" cy="5.5" r="1.5"/>

  <!-- Profile -->

        <circle cx="12" cy="8" r="4"/>
        <path d="M4 21c.8-4 3.5-6 8-6s7.2 2 8 6"/>
